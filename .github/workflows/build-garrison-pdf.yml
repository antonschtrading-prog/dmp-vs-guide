name: Build DMP garrison PDF
on:
  push:
    branches: [main]
    paths:
      - garrison.html
      - .github/workflows/build-garrison-pdf.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF renderer
        run: pip install weasyprint
      - name: Generate PDF from published guide
        run: |
          python - <<'PY'
          from weasyprint import HTML, CSS
          HTML(filename='garrison.html',base_url='.').write_pdf(
              'DMP_Garrison_Guide.pdf',
              stylesheets=[CSS(string='@page {size:A4;margin:14mm} @media print {nav {display:none} main {padding:0; min-height:0} body {background:#fff} a {text-decoration:none}}')]
          )
          PY
      - name: Commit PDF to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DMP_Garrison_Guide.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish DMP garrison guide as PDF"
            git push
          fi
